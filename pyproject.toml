[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-analyst"
version = "0.1.0"
description = "Screen 10-K filings: XBRL financials, accounting red flags, risk factor diffs and Claude-written memos with citations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.60",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
filing-analyst = "filing_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filing_analyst = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
